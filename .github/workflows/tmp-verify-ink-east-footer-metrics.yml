name: Temporary verify Ink East footer metrics

on:
  push:
    branches:
      - agent/ink-east-footer-normalization

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/ink-east-footer-normalization
          fetch-depth: 0

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Measure shared footer at fixed viewports
        shell: bash
        run: |
          python3 -m http.server 4173 --directory preview >/tmp/footer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');

          const targets = [
            'ink-east-v1.html','ink-east-issue-001-v1.html','ink-east-article-001-v1.html',
            'ink-east-article-002-vip-v1.html','ink-east-articles-archive-v1.html','ink-east-vip-library-v1.html',
            'ink-east-reading-room-v1.html','ink-east-membership-v1.html','ink-east-custom-reading-v1.html',
            'ink-east-custom-ebook-v1.html','ink-east-letters-form-v1.html','ink-east-reader-notes-component-v1.html',
            'ink-east-community-v1.html',
          ];
          const viewports = [
            { name: 'desktop', width: 1365, height: 991 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const tolerance = 0.1;
          const round = value => Math.round(value * 1000) / 1000;

          function compare(a, b, path = '', diffs = []) {
            if (typeof a === 'number' && typeof b === 'number') {
              if (Math.abs(a - b) > tolerance) diffs.push(`${path}: ${a} != ${b}`);
              return diffs;
            }
            if (Array.isArray(a) && Array.isArray(b)) {
              if (a.length !== b.length) return diffs.concat(`${path}.length: ${a.length} != ${b.length}`);
              a.forEach((value, index) => compare(value, b[index], `${path}[${index}]`, diffs));
              return diffs;
            }
            if (a && b && typeof a === 'object' && typeof b === 'object') {
              for (const key of Object.keys(a)) compare(a[key], b[key], path ? `${path}.${key}` : key, diffs);
              return diffs;
            }
            if (a !== b) diffs.push(`${path}: ${String(a)} != ${String(b)}`);
            return diffs;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failed = false;

            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
              const measurements = [];

              for (const target of targets) {
                const page = await context.newPage();
                await page.goto(`http://127.0.0.1:4173/${target}`, { waitUntil: 'networkidle' });
                await page.evaluate(async () => {
                  if (document.fonts) {
                    await Promise.all([
                      document.fonts.load('15px "EB Garamond"', 'Ink East'),
                      document.fonts.load('18px "Noto Serif SC"', '墨與東'),
                      document.fonts.load('10px "JetBrains Mono"', 'Read'),
                      document.fonts.ready,
                    ]);
                  }
                });
                await page.waitForFunction(() => {
                  const host = document.querySelector('ink-east-footer');
                  return Boolean(host?.shadowRoot?.querySelector('footer'));
                });

                await page.evaluate(() => {
                  document.documentElement.style.scrollBehavior = 'auto';
                  document.body.style.scrollBehavior = 'auto';
                  window.scrollTo({ top: document.documentElement.scrollHeight, left: 0, behavior: 'instant' });
                });
                await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));

                const metrics = await page.evaluate(() => {
                  const host = document.querySelector('ink-east-footer');
                  const root = host.shadowRoot;
                  const hostRect = host.getBoundingClientRect();
                  const geometry = element => {
                    const rect = element.getBoundingClientRect();
                    return {
                      top: Math.round((rect.top - hostRect.top) * 1000) / 1000,
                      left: Math.round((rect.left - hostRect.left) * 1000) / 1000,
                      width: Math.round(rect.width * 1000) / 1000,
                      height: Math.round(rect.height * 1000) / 1000,
                    };
                  };
                  const many = selector => [...root.querySelectorAll(selector)].map(geometry);
                  const footerRect = root.querySelector('footer').getBoundingClientRect();
                  return {
                    fonts: {
                      eb: document.fonts.check('15px "EB Garamond"', 'Ink East'),
                      noto: document.fonts.check('18px "Noto Serif SC"', '墨與東'),
                      mono: document.fonts.check('10px "JetBrains Mono"', 'Read'),
                    },
                    geometry: {
                      host: { width: Math.round(hostRect.width * 1000) / 1000, height: Math.round(hostRect.height * 1000) / 1000 },
                      footer: geometry(root.querySelector('footer')),
                      mark: geometry(root.querySelector('.foot-mark')),
                      ampers: geometry(root.querySelector('.ampers')),
                      footCols: geometry(root.querySelector('.foot-cols')),
                      headings: many('h5'),
                      rows: many('li'),
                      links: many('li a'),
                      colophon: geometry(root.querySelector('.colophon-final')),
                    },
                    bottom: {
                      footerBottomGap: Math.round((innerHeight - footerRect.bottom) * 1000) / 1000,
                      hostBottomGap: Math.round((innerHeight - hostRect.bottom) * 1000) / 1000,
                      scrollY: Math.round(scrollY * 1000) / 1000,
                      scrollMax: Math.round((document.documentElement.scrollHeight - innerHeight) * 1000) / 1000,
                    },
                  };
                });

                measurements.push({ target, metrics });
                await page.close();
              }

              const baseline = measurements[0];
              console.log(`\n[${viewport.name}] baseline ${baseline.target}`);
              console.log(JSON.stringify(baseline.metrics, null, 2));

              for (const sample of measurements.slice(1)) {
                const geometryDiffs = compare(baseline.metrics.geometry, sample.metrics.geometry);
                const fontDiffs = compare(baseline.metrics.fonts, sample.metrics.fonts);
                const bottomDiffs = compare(
                  { footerBottomGap: baseline.metrics.bottom.footerBottomGap, hostBottomGap: baseline.metrics.bottom.hostBottomGap },
                  { footerBottomGap: sample.metrics.bottom.footerBottomGap, hostBottomGap: sample.metrics.bottom.hostBottomGap }
                );

                if (geometryDiffs.length || fontDiffs.length || bottomDiffs.length) {
                  failed = true;
                  console.error(`\n[${viewport.name}] FAIL ${sample.target}`);
                  for (const diff of [...geometryDiffs, ...fontDiffs, ...bottomDiffs].slice(0, 60)) console.error(`  ${diff}`);
                  console.error(`  scrollY=${sample.metrics.bottom.scrollY} scrollMax=${sample.metrics.bottom.scrollMax}`);
                } else {
                  console.log(`[${viewport.name}] PASS ${sample.target} bottomGap=${sample.metrics.bottom.footerBottomGap}`);
                }
              }

              await context.close();
            }

            await browser.close();
            if (failed) process.exit(1);
            console.log('\nPASS: all 13 pages have identical shared-footer internal geometry, font availability, and bottom-of-viewport alignment at both viewports.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Remove temporary verifier after success
        shell: bash
        run: |
          rm .github/workflows/tmp-verify-ink-east-footer-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-verify-ink-east-footer-metrics.yml
          git diff --cached --check
          git commit -m "chore: remove temporary footer metrics verifier"
          git push origin HEAD:agent/ink-east-footer-normalization
