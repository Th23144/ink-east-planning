name: Temporary verify Ink East footer metrics

on:
  push:
    branches:
      - agent/ink-east-footer-normalization

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/ink-east-footer-normalization
          fetch-depth: 0

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Measure shared footer at fixed viewports
        shell: bash
        run: |
          python3 -m http.server 4173 --directory preview >/tmp/footer-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');

          const targets = [
            'ink-east-v1.html',
            'ink-east-issue-001-v1.html',
            'ink-east-article-001-v1.html',
            'ink-east-article-002-vip-v1.html',
            'ink-east-articles-archive-v1.html',
            'ink-east-vip-library-v1.html',
            'ink-east-reading-room-v1.html',
            'ink-east-membership-v1.html',
            'ink-east-custom-reading-v1.html',
            'ink-east-custom-ebook-v1.html',
            'ink-east-letters-form-v1.html',
            'ink-east-reader-notes-component-v1.html',
            'ink-east-community-v1.html',
          ];

          const viewports = [
            { name: 'desktop', width: 1365, height: 991 },
            { name: 'mobile', width: 390, height: 844 },
          ];

          const round = value => Math.round(value * 1000) / 1000;

          function compare(a, b, path = '', diffs = []) {
            if (typeof a === 'number' && typeof b === 'number') {
              if (Math.abs(a - b) > 0.1) diffs.push(`${path}: ${a} != ${b}`);
              return diffs;
            }
            if (Array.isArray(a) && Array.isArray(b)) {
              if (a.length !== b.length) {
                diffs.push(`${path}.length: ${a.length} != ${b.length}`);
                return diffs;
              }
              a.forEach((value, index) => compare(value, b[index], `${path}[${index}]`, diffs));
              return diffs;
            }
            if (a && b && typeof a === 'object' && typeof b === 'object') {
              for (const key of Object.keys(a)) compare(a[key], b[key], path ? `${path}.${key}` : key, diffs);
              return diffs;
            }
            if (a !== b) diffs.push(`${path}: ${String(a)} != ${String(b)}`);
            return diffs;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failed = false;

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
              });

              const measurements = [];

              for (const target of targets) {
                const page = await context.newPage();
                await page.goto(`http://127.0.0.1:4173/${target}`, { waitUntil: 'networkidle' });
                await page.evaluate(async () => {
                  if (document.fonts && document.fonts.ready) await document.fonts.ready;
                });
                await page.waitForFunction(() => {
                  const host = document.querySelector('ink-east-footer');
                  return Boolean(host && host.shadowRoot && host.shadowRoot.querySelector('footer'));
                });
                await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));
                await page.waitForTimeout(100);

                const metrics = await page.evaluate(() => {
                  const host = document.querySelector('ink-east-footer');
                  const root = host.shadowRoot;
                  const hostRect = host.getBoundingClientRect();
                  const rel = element => {
                    const rect = element.getBoundingClientRect();
                    return {
                      top: Math.round((rect.top - hostRect.top) * 1000) / 1000,
                      left: Math.round((rect.left - hostRect.left) * 1000) / 1000,
                      width: Math.round(rect.width * 1000) / 1000,
                      height: Math.round(rect.height * 1000) / 1000,
                      viewportTop: Math.round(rect.top * 1000) / 1000,
                      viewportBottom: Math.round(rect.bottom * 1000) / 1000,
                    };
                  };
                  const many = selector => [...root.querySelectorAll(selector)].map(rel);
                  return {
                    fonts: {
                      eb: document.fonts.check('15px "EB Garamond"'),
                      noto: document.fonts.check('15px "Noto Serif SC"'),
                      mono: document.fonts.check('10px "JetBrains Mono"'),
                    },
                    host: {
                      width: Math.round(hostRect.width * 1000) / 1000,
                      height: Math.round(hostRect.height * 1000) / 1000,
                      viewportTop: Math.round(hostRect.top * 1000) / 1000,
                      viewportBottom: Math.round(hostRect.bottom * 1000) / 1000,
                    },
                    footer: rel(root.querySelector('footer')),
                    mark: rel(root.querySelector('.foot-mark')),
                    ampers: rel(root.querySelector('.ampers')),
                    footCols: rel(root.querySelector('.foot-cols')),
                    headings: many('h5'),
                    rows: many('li'),
                    links: many('li a'),
                    colophon: rel(root.querySelector('.colophon-final')),
                    viewport: { width: innerWidth, height: innerHeight },
                  };
                });

                measurements.push({ target, metrics });
                await page.close();
              }

              const baseline = measurements[0];
              console.log(`\n[${viewport.name}] baseline ${baseline.target}`);
              console.log(JSON.stringify({
                host: baseline.metrics.host,
                footCols: baseline.metrics.footCols,
                firstHeading: baseline.metrics.headings[0],
                firstLink: baseline.metrics.links[0],
                colophon: baseline.metrics.colophon,
                fonts: baseline.metrics.fonts,
              }, null, 2));

              for (const sample of measurements.slice(1)) {
                const diffs = compare(baseline.metrics, sample.metrics);
                if (diffs.length) {
                  failed = true;
                  console.error(`\n[${viewport.name}] ${sample.target} differs from ${baseline.target}:`);
                  for (const diff of diffs.slice(0, 40)) console.error(`  ${diff}`);
                  if (diffs.length > 40) console.error(`  ... ${diffs.length - 40} more`);
                } else {
                  console.log(`[${viewport.name}] PASS ${sample.target}`);
                }
              }

              await context.close();
            }

            await browser.close();
            if (failed) process.exit(1);
            console.log('\nPASS: all 13 active Ink & East pages have identical shared-footer geometry at both fixed viewports.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove temporary verifier after success
        shell: bash
        run: |
          rm .github/workflows/tmp-verify-ink-east-footer-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-verify-ink-east-footer-metrics.yml
          git diff --cached --check
          git commit -m "chore: remove temporary footer metrics verifier"
          git push origin HEAD:agent/ink-east-footer-normalization
