name: Temporary migrate and verify Ink East public nav

on:
  push:
    branches:
      - agent/ink-east-public-nav-normalization

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/ink-east-public-nav-normalization
          fetch-depth: 0

      - name: Migrate public navigation sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          public_nav = r'''(() => {
            const items = [
              ['home', './ink-east-v1.html', 'Home', true],
              ['issues', './ink-east-issue-001-v1.html', 'Issues', true],
              ['articles', './ink-east-articles-archive-v1.html', 'Articles', true],
              ['topics', '', 'Topics', false],
              ['collections', '', 'Collections', false],
              ['search', '', 'Search', false],
              ['about', '', 'About', false],
            ];

            class InkEastPublicNav extends HTMLElement {
              connectedCallback() {
                if (this.shadowRoot) return;
                const mode = this.getAttribute('mode') === 'full' ? 'full' : 'cover';
                const active = this.getAttribute('active') || '';
                const root = this.attachShadow({ mode: 'open' });
                const links = items.map(([key, href, label, live]) => {
                  const current = active === key;
                  if (!live) return `<span class="nav-item placeholder" data-placeholder="true">${label}</span>`;
                  return `<a class="nav-item${current ? ' active' : ''}" href="${href}"${current ? ' aria-current="page"' : ''}>${label}</a>`;
                }).join('');

                root.innerHTML = `
                  <style>
                    :host {
                      all: initial;
                      --paper: #f4ede0;
                      --ink: #1a1611;
                      --ink-soft: #4a4036;
                      --ink-faint: #8a7f70;
                      --seal: #a02d23;
                      --rule: rgba(26,22,17,.28);
                      --rule-soft: rgba(26,22,17,.12);
                      --serif-en: "EB Garamond","Noto Serif SC",Georgia,serif;
                      --serif-cn: "Noto Serif SC","EB Garamond",serif;
                      --mono: "JetBrains Mono",ui-monospace,monospace;
                      display: block;
                      width: 100%;
                      min-width: 0;
                      margin: 0;
                      padding: 0;
                      color: var(--ink-soft);
                      font-family: var(--mono);
                      font-size: 10px;
                      font-style: normal;
                      font-weight: 400;
                      line-height: 24px;
                      letter-spacing: .18em;
                      text-transform: uppercase;
                      font-feature-settings: normal;
                      font-kerning: normal;
                      font-variant: normal;
                      font-synthesis: none;
                      text-rendering: geometricPrecision;
                      -webkit-font-smoothing: antialiased;
                      -webkit-text-size-adjust: 100%;
                      text-size-adjust: 100%;
                    }
                    *, *::before, *::after { box-sizing: border-box; }
                    a { color: inherit; text-decoration: none; }
                    .nav-item { white-space: nowrap; }
                    a.nav-item { transition: color .2s, border-color .2s; }
                    a.nav-item:hover { color: var(--seal); }
                    .placeholder { color: var(--ink-faint); cursor: default; }

                    .cover-nav {
                      width: 100%;
                      display: grid;
                      grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
                      align-items: center;
                      padding: 0 0 24px;
                      border-bottom: 1px solid var(--rule);
                      position: relative;
                      z-index: 2;
                      font-family: var(--mono);
                      font-size: 10px;
                      line-height: 24px;
                      letter-spacing: .18em;
                      text-transform: uppercase;
                      color: var(--ink-soft);
                    }
                    .cover-nav .left { min-width: 0; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
                    .cover-nav .center {
                      height: 24px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-family: var(--serif-cn);
                      font-size: 13px;
                      font-weight: 500;
                      line-height: 24px;
                      letter-spacing: .5em;
                      color: var(--ink);
                      white-space: nowrap;
                    }
                    .cover-nav .right { min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 28px; }
                    .cover-nav .action { white-space: nowrap; }
                    .cover-nav .action.placeholder { color: var(--ink-faint); }

                    .full-nav {
                      width: 100%;
                      display: flex;
                      align-items: center;
                      justify-content: space-between;
                      gap: 24px;
                      padding: 26px clamp(28px,5.5vw,100px);
                      border-bottom: 1px solid var(--rule-soft);
                      position: relative;
                      z-index: 5;
                      flex-wrap: wrap;
                    }
                    .brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
                    .brand .mark { font-family: var(--serif-en); font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .01em; text-transform: none; color: var(--ink); }
                    .brand .mark em { font-style: italic; color: var(--seal); }
                    .brand .cn { font-family: var(--serif-cn); font-size: 13px; line-height: 24px; letter-spacing: .3em; text-transform: none; color: var(--ink-faint); }
                    .full-nav .links { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; line-height: 24px; letter-spacing: .16em; text-transform: uppercase; }
                    .full-nav .nav-item { height: 28px; display: inline-flex; align-items: center; padding: 0 0 4px; border-bottom: 1px solid transparent; color: var(--ink-soft); }
                    .full-nav .nav-item.active { color: var(--ink); border-bottom-color: var(--seal); }
                    .full-nav .placeholder { color: var(--ink-faint); }

                    @media (max-width: 720px) {
                      .cover-nav { grid-template-columns: 1fr; text-align: center; gap: 6px; padding-bottom: 14px; }
                      .cover-nav .left, .cover-nav .right { justify-content: center; }
                      .cover-nav .left { gap: 6px 18px; }
                      .cover-nav .right { display: none; }
                    }
                    @media (max-width: 600px) {
                      .full-nav { padding: 16px 18px; gap: 14px; align-items: flex-start; flex-direction: column; }
                      .full-nav .links { gap: 6px 18px; font-size: 10px; }
                    }
                  </style>
                  ${mode === 'full' ? `
                    <nav class="full-nav" aria-label="Ink & East public navigation">
                      <div class="brand"><span class="mark">Ink <em>&amp;</em> East</span><span class="cn">墨與東</span></div>
                      <div class="links">${links}</div>
                    </nav>` : `
                    <nav class="cover-nav" aria-label="Ink & East public navigation">
                      <div class="left">${links}</div>
                      <div class="center">墨 與 東</div>
                      <div class="right"><a class="action" href="#dispatch">Subscribe</a><span class="action placeholder" data-placeholder="true">Sign in</span></div>
                    </nav>`}
                `;
              }
            }
            if (!customElements.get('ink-east-public-nav')) customElements.define('ink-east-public-nav', InkEastPublicNav);
          })();
          '''

          context_bar = r'''(() => {
            const esc = value => String(value ?? '')
              .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');

            class InkEastContextBar extends HTMLElement {
              connectedCallback() {
                if (this.shadowRoot) return;
                const mode = this.getAttribute('mode') === 'article' ? 'article' : 'compact';
                const backHref = esc(this.getAttribute('back-href') || './ink-east-v1.html');
                const backLabel = esc(this.getAttribute('back-label') || '← Back to Ink & East');
                const center = esc(this.getAttribute('center') || 'INK & EAST');
                const right = esc(this.getAttribute('right') || '');
                const root = this.attachShadow({ mode: 'open' });
                root.innerHTML = `
                  <style>
                    :host {
                      all: initial;
                      --paper-light: #faf5e9;
                      --ink: #1a1611;
                      --ink-faint: #8a7f70;
                      --seal: #a02d23;
                      --mono: "JetBrains Mono",ui-monospace,monospace;
                      display: block;
                      width: 100%;
                      min-width: 0;
                      margin: 0;
                      padding: 0;
                      font-family: var(--mono);
                      font-style: normal;
                      font-weight: 400;
                      font-feature-settings: normal;
                      font-kerning: normal;
                      font-variant: normal;
                      font-synthesis: none;
                      text-rendering: geometricPrecision;
                      -webkit-font-smoothing: antialiased;
                      -webkit-text-size-adjust: 100%;
                      text-size-adjust: 100%;
                    }
                    *, *::before, *::after { box-sizing: border-box; }
                    a { color: inherit; text-decoration: none; }
                    .bar { width: 100%; background: var(--ink); color: var(--paper-light); text-transform: uppercase; }
                    .back { color: var(--seal); border-bottom: 1px dashed var(--seal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                    .center, .right { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

                    .compact {
                      height: 32px;
                      padding: 0 28px;
                      display: grid;
                      grid-template-columns: minmax(0,1fr) auto;
                      align-items: center;
                      gap: 16px;
                      font-size: 10px;
                      line-height: 16px;
                      letter-spacing: .1em;
                    }
                    .compact .back { justify-self: start; max-width: 100%; }
                    .compact .center { justify-self: end; text-align: right; }

                    .article {
                      height: 36px;
                      padding: 0 28px;
                      display: grid;
                      grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
                      align-items: center;
                      gap: 24px;
                      font-size: 10px;
                      line-height: 16px;
                      letter-spacing: .18em;
                    }
                    .article .back { justify-self: start; max-width: 100%; }
                    .article .center { justify-self: center; color: var(--paper-light); letter-spacing: .3em; text-align: center; }
                    .article .right { justify-self: end; color: var(--ink-faint); text-align: right; }

                    @media (max-width: 720px) {
                      .compact { height: 30px; padding: 0 16px; font-size: 9px; gap: 10px; }
                      .article { height: 32px; padding: 0 16px; font-size: 9px; gap: 10px; grid-template-columns: minmax(0,1fr) auto; }
                      .article .right { display: none; }
                      .article .center { justify-self: end; max-width: 100%; }
                    }
                  </style>
                  <div class="bar ${mode}">
                    <a class="back" href="${backHref}">${backLabel}</a>
                    <span class="center">${center}</span>
                    ${mode === 'article' ? `<span class="right">${right}</span>` : ''}
                  </div>
                `;
              }
            }
            if (!customElements.get('ink-east-context-bar')) customElements.define('ink-east-context-bar', InkEastContextBar);
          })();
          '''

          Path('preview/shared/ink-east-public-nav.js').write_text(public_nav, encoding='utf-8')
          Path('preview/shared/ink-east-context-bar.js').write_text(context_bar, encoding='utf-8')

          files = {
            'preview/ink-east-v1.html': {
              'context': dict(mode='compact', back_href='./index.html', back_label='← back to directions', center='INK & EAST · ISSUE 001 · DESIGN DRAFT V1'),
              'nav': dict(mode='cover', active='home'),
            },
            'preview/ink-east-issue-001-v1.html': {
              'context': dict(mode='compact', back_href='./ink-east-v1.html', back_label='← Back to Issue 001 cover', center='INK & EAST · ISSUE 001 · TABLE OF CONTENTS'),
            },
            'preview/ink-east-article-001-v1.html': {
              'context': dict(mode='article', back_href='./ink-east-issue-001-v1.html', back_label='← back to Issue 001', center='No. 001 · 無 · Wu Wei', right='Spring 2026 · ISSN 2026.001'),
            },
            'preview/ink-east-article-002-vip-v1.html': {
              'context': dict(mode='article', back_href='./ink-east-vip-library-v1.html', back_label='← Back to VIP Library', center='VIP LIBRARY · 藏 書 樓 · vol. 01', right='Updated when ready · Est. 2026'),
            },
            'preview/ink-east-articles-archive-v1.html': {
              'context': dict(mode='compact', back_href='./ink-east-v1.html', back_label='← Back to Ink & East', center='INK & EAST · PUBLIC ARCHIVE · 文庫'),
              'nav': dict(mode='full', active='articles'),
            },
          }

          def attrs(tag, values):
            return '<' + tag + ' ' + ' '.join(f'{k.replace("_", "-")}="{html.escape(v, quote=True)}"' for k, v in values.items()) + f'></{tag}>'

          def strip_rules(text, tokens):
            pattern = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
            def sub(match):
              selector = match.group(1).strip()
              return '' if any(token in selector for token in tokens) else match.group(0)
            old = None
            while old != text:
              old = text
              text = pattern.sub(sub, text)
            text = re.sub(r'@media[^{}]+\{\s*\}', '', text)
            return text

          for path_str, cfg in files.items():
            path = Path(path_str)
            text = path.read_text(encoding='utf-8')

            if path_str.endswith('ink-east-article-001-v1.html') or path_str.endswith('ink-east-article-002-vip-v1.html'):
              pattern = re.compile(r'<div class="issue-bar">.*?</div>', re.S)
              if len(pattern.findall(text)) != 1: raise SystemExit(f'{path_str}: expected one issue-bar')
              mount = attrs('ink-east-context-bar', cfg['context']) + '\n<script src="./shared/ink-east-context-bar.js"></script>'
              text = pattern.sub(mount, text, count=1)
              text = strip_rules(text, ['.issue-bar'])
            else:
              pattern = re.compile(r'<div class="backbar">.*?</div>', re.S)
              if len(pattern.findall(text)) != 1: raise SystemExit(f'{path_str}: expected one backbar')
              mount = attrs('ink-east-context-bar', cfg['context']) + '\n<script src="./shared/ink-east-context-bar.js"></script>'
              text = pattern.sub(mount, text, count=1)
              text = strip_rules(text, ['.backbar'])

            if 'nav' in cfg:
              if cfg['nav']['mode'] == 'cover':
                pattern = re.compile(r'<div class="cover-top">.*?</div>\s*(?=<div class="cover-middle">)', re.S)
                if len(pattern.findall(text)) != 1: raise SystemExit(f'{path_str}: expected one cover-top')
                mount = attrs('ink-east-public-nav', cfg['nav']) + '\n<script src="./shared/ink-east-public-nav.js"></script>\n\n'
                text = pattern.sub(mount, text, count=1)
                text = strip_rules(text, ['.cover-top'])
              else:
                pattern = re.compile(r'<nav class="topnav">.*?</nav>', re.S)
                if len(pattern.findall(text)) != 1: raise SystemExit(f'{path_str}: expected one topnav')
                mount = attrs('ink-east-public-nav', cfg['nav']) + '\n<script src="./shared/ink-east-public-nav.js"></script>'
                text = pattern.sub(mount, text, count=1)
                text = strip_rules(text, ['.topnav', '.navlinks', '.brand'])

            legacy_markup = ['<div class="backbar">', '<div class="issue-bar">', '<div class="cover-top">', '<nav class="topnav">']
            if any(token in text for token in legacy_markup): raise SystemExit(f'{path_str}: legacy public shell markup remains')
            styles = '\n'.join(re.findall(r'<style[^>]*>(.*?)</style>', text, re.S))
            styles = re.sub(r'/\*.*?\*/', '', styles, flags=re.S)
            if re.search(r'\.(?:backbar|issue-bar|cover-top|topnav)\b', styles): raise SystemExit(f'{path_str}: legacy public shell CSS remains')
            if text.count('<ink-east-context-bar ') != 1 or text.count('./shared/ink-east-context-bar.js') != 1: raise SystemExit(f'{path_str}: context mount invalid')
            if text.count('<ink-east-footer></ink-east-footer>') != 1: raise SystemExit(f'{path_str}: footer mount disturbed')
            if 'nav' in cfg and (text.count('<ink-east-public-nav ') != 1 or text.count('./shared/ink-east-public-nav.js') != 1): raise SystemExit(f'{path_str}: public nav mount invalid')
            path.write_text(text, encoding='utf-8')
            print('Migrated', path_str)

          print('PASS: migrated 5/5 public pages without flattening cover/context/full-nav modes.')
          PY

      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify public navigation geometry and semantics
        shell: bash
        run: |
          python3 -m http.server 4173 --directory preview >/tmp/public-nav-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const pages = [
            ['ink-east-v1.html', 'compact', 'cover', 'home'],
            ['ink-east-issue-001-v1.html', 'compact', null, null],
            ['ink-east-article-001-v1.html', 'article', null, null],
            ['ink-east-article-002-vip-v1.html', 'article', null, null],
            ['ink-east-articles-archive-v1.html', 'compact', 'full', 'articles'],
          ];
          const viewports = [
            { name:'desktop', width:1365, height:991 },
            { name:'tablet', width:820, height:1024 },
            { name:'mobile', width:390, height:844 },
          ];
          const labels = ['Home','Issues','Articles','Topics','Collections','Search','About'];
          const hrefs = ['./ink-east-v1.html','./ink-east-issue-001-v1.html','./ink-east-articles-archive-v1.html',null,null,null,null];
          const round = n => Math.round(n * 1000) / 1000;
          const close = (a,b) => Math.abs(a-b) <= .1;

          (async() => {
            const browser = await chromium.launch({headless:true});
            let failed = false;
            for (const vp of viewports) {
              const ctx = await browser.newContext({viewport:{width:vp.width,height:vp.height},deviceScaleFactor:1});
              const compact = [], article = [], navSamples = [];
              for (const [file, contextMode, navMode, active] of pages) {
                const page = await ctx.newPage();
                await page.goto(`http://127.0.0.1:4173/${file}`, {waitUntil:'networkidle'});
                await page.evaluate(async()=>{ if(document.fonts) await document.fonts.ready; });
                await page.waitForFunction(() => document.querySelector('ink-east-context-bar')?.shadowRoot?.querySelector('.bar'));
                if (navMode) await page.waitForFunction(() => document.querySelector('ink-east-public-nav')?.shadowRoot?.querySelector('nav'));
                await page.evaluate(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));

                const data = await page.evaluate(() => {
                  const c = document.querySelector('ink-east-context-bar');
                  const cr = c.getBoundingClientRect();
                  const bar = c.shadowRoot.querySelector('.bar').getBoundingClientRect();
                  const n = document.querySelector('ink-east-public-nav');
                  let nav = null;
                  if (n) {
                    const root = n.shadowRoot;
                    const nr = n.getBoundingClientRect();
                    const items = [...root.querySelectorAll('.nav-item')];
                    nav = {
                      mode: n.getAttribute('mode'),
                      active: items.filter(x=>x.classList.contains('active')).map(x=>x.textContent.trim()),
                      labels: items.map(x=>x.textContent.trim()),
                      hrefs: items.map(x=>x.tagName === 'A' ? x.getAttribute('href') : null),
                      placeholders: items.map(x=>x.hasAttribute('data-placeholder')),
                      rect: {width:roundLocal(nr.width),height:roundLocal(nr.height)},
                    };
                  }
                  function roundLocal(x){ return Math.round(x*1000)/1000; }
                  return {
                    contextMode: c.getAttribute('mode'),
                    context: {hostW:roundLocal(cr.width),hostH:roundLocal(cr.height),barW:roundLocal(bar.width),barH:roundLocal(bar.height)},
                    nav,
                    overflow: document.documentElement.scrollWidth - window.innerWidth,
                    footer: document.querySelectorAll('ink-east-footer').length,
                    serviceNav: document.querySelectorAll('ink-east-service-nav').length,
                  };
                });

                if (data.contextMode !== contextMode) { console.error(vp.name,file,'context mode',data.contextMode,contextMode); failed=true; }
                if (data.footer !== 1 || data.serviceNav !== 0 || data.overflow > 1) { console.error(vp.name,file,'boundary/overflow',data); failed=true; }
                (contextMode === 'compact' ? compact : article).push([file,data.context]);

                if (navMode) {
                  const expectedActive = active ? [active === 'home' ? 'Home' : 'Articles'] : [];
                  if (data.nav.mode !== navMode || JSON.stringify(data.nav.labels) !== JSON.stringify(labels) || JSON.stringify(data.nav.hrefs) !== JSON.stringify(hrefs) || JSON.stringify(data.nav.active) !== JSON.stringify(expectedActive)) {
                    console.error(vp.name,file,'nav semantic mismatch',data.nav); failed=true;
                  }
                  const expectedPlaceholders=[false,false,false,true,true,true,true];
                  if (JSON.stringify(data.nav.placeholders)!==JSON.stringify(expectedPlaceholders)) { console.error(vp.name,file,'placeholder mismatch'); failed=true; }
                  navSamples.push([file,data.nav]);
                }
                await page.close();
              }

              for (const group of [compact, article]) {
                const base = group[0][1];
                for (const [file,m] of group.slice(1)) {
                  for (const key of ['hostW','hostH','barW','barH']) if (!close(base[key],m[key])) { console.error(vp.name,file,'context geometry',key,base[key],m[key]); failed=true; }
                }
              }
              if (navSamples.length !== 2) { console.error(vp.name,'expected Home + Archive nav samples'); failed=true; }
              console.log(`[${vp.name}] compact context ${compact[0][1].hostW}×${compact[0][1].hostH}; article context ${article[0][1].hostW}×${article[0][1].hostH}; Home/Archive canonical labels PASS`);
              await ctx.close();
            }
            await browser.close();
            if (failed) process.exit(1);
            console.log('PASS: 5/5 public pages preserve distinct cover/context/full-nav modes while sharing canonical public navigation data and context-bar sources; no horizontal overflow at desktop/tablet/mobile.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit verified migration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-audit-public-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/ink-east-v1.html \
                  preview/ink-east-issue-001-v1.html \
                  preview/ink-east-article-001-v1.html \
                  preview/ink-east-article-002-vip-v1.html \
                  preview/ink-east-articles-archive-v1.html \
                  preview/shared/ink-east-public-nav.js \
                  preview/shared/ink-east-context-bar.js \
                  .github/workflows/tmp-audit-public-nav.yml
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/tmp-audit-public-nav.yml \
            preview/ink-east-article-001-v1.html \
            preview/ink-east-article-002-vip-v1.html \
            preview/ink-east-articles-archive-v1.html \
            preview/ink-east-issue-001-v1.html \
            preview/ink-east-v1.html \
            preview/shared/ink-east-context-bar.js \
            preview/shared/ink-east-public-nav.js | sort)
          test "$changed" = "$expected"
          git commit -m "preview(ink-east): share public navigation sources"
          git push origin HEAD:agent/ink-east-public-nav-normalization
