name: Temporary patch Spatial Flow tablet shell

on:
  push:
    branches:
      - agent/spatial-flow-ecommerce-shell-normalization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spatial-flow-ecommerce-shell-normalization
          fetch-depth: 0
      - name: Add tablet breakpoint and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('preview/shared/spatial-flow-shell.js')
          text = p.read_text(encoding='utf-8')
          if '@media (max-width: 960px)' in text:
              raise SystemExit('tablet breakpoint already exists; refusing duplicate patch')
          marker = '      @media (max-width: 720px) {'
          if text.count(marker) != 1:
              raise SystemExit('expected 720px shell breakpoint exactly once')
          block = '\n'.join([
              '      @media (max-width: 960px) {',
              '        .masthead .center { display: none; }',
              '        .site-header { grid-template-columns: 1fr auto; align-items: center; }',
              '        .primary { display: none; }',
              '        .wordmark { justify-self: start; }',
              '      }',
              '',
          ])
          p.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY
          rm .github/workflows/tmp-spatial-flow-tablet-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/shared/spatial-flow-shell.js .github/workflows/tmp-spatial-flow-tablet-fix.yml
          git diff --cached --check
          git commit -m "fix(spatial-flow): collapse ecommerce shell at tablet width"
          git push origin HEAD:agent/spatial-flow-ecommerce-shell-normalization
