name: Temporary migrate and verify Ink East service nav

on:
  push:
    branches:
      - agent/ink-east-service-nav-normalization

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: agent/ink-east-service-nav-normalization
          fetch-depth: 0

      - name: Migrate eight pages to one shared navigation source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          configs = {
              'preview/ink-east-membership-v1.html': dict(active='membership', auth='guest', context='INK & EAST · MEMBERSHIP · 加 入', note='An invitation, not a pitch'),
              'preview/ink-east-vip-library-v1.html': dict(active='vip-library', auth='guest', context='INK & EAST · VIP LIBRARY · 藏 書 樓', note='Updated when ready · Est. 2026'),
              'preview/ink-east-reading-room-v1.html': dict(active='reading-room', auth='member', context='INK & EAST · READING ROOM · 讀 書 室', note='Members only · Updated as you read'),
              'preview/ink-east-letters-form-v1.html': dict(active='ask-ancient', auth='guest', context='INK & EAST · ASK THE ANCIENT TEXT · 問 古 籍', note='Letters · Open to all readers'),
              'preview/ink-east-custom-ebook-v1.html': dict(active='studio', auth='guest', context='Studio · Custom Ebook', note='Home', note_href='./ink-east-v1.html'),
              'preview/ink-east-community-v1.html': dict(active='community', auth='guest', context='INK & EAST · COMMUNITY · 聚 流', note='A quiet front porch · Read-only aggregator'),
              'preview/ink-east-custom-reading-v1.html': dict(active='studio', auth='guest', context='INK & EAST · CUSTOM READING · 私 讀', note='By appointment · Replies within a working week'),
              'preview/ink-east-reader-notes-component-v1.html': dict(active='', auth='guest', context='INK & EAST · READER NOTES · 讀 者 筆 記 · COMPONENT SPEC v1', note='Visual contract · for engineering'),
          }

          component = r'''(() => {
            const navItems = [
              ['home', './ink-east-v1.html', 'Home'],
              ['issues', './ink-east-issue-001-v1.html', 'Issues'],
              ['reading-room', './ink-east-reading-room-v1.html', 'Reading Room'],
              ['vip-library', './ink-east-vip-library-v1.html', 'VIP Library'],
              ['ask-ancient', './ink-east-letters-form-v1.html', 'Ask the Ancient'],
              ['studio', './ink-east-custom-ebook-v1.html', 'Studio'],
              ['membership', './ink-east-membership-v1.html', 'Membership'],
              ['community', './ink-east-community-v1.html', 'Community'],
            ];

            const escapeHTML = value => String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;');

            class InkEastServiceNav extends HTMLElement {
              connectedCallback() {
                if (this.shadowRoot) return;

                const active = this.getAttribute('active') || '';
                const auth = this.getAttribute('auth') === 'member' ? 'member' : 'guest';
                const context = escapeHTML(this.getAttribute('context') || 'INK & EAST');
                const note = escapeHTML(this.getAttribute('note') || '');
                const noteHref = this.getAttribute('note-href');

                const left = navItems.map(([key, href, label]) => {
                  const isActive = active === key;
                  return `<a class="nav-link${isActive ? ' active' : ''}" href="${href}"${isActive ? ' aria-current="page"' : ''}>${label}</a>`;
                }).join('');

                const account = auth === 'member'
                  ? '<a class="nav-link" href="#account">Account</a><a class="nav-link" href="/wp-login.php?action=logout">Sign out</a>'
                  : '<a class="nav-link" href="/wp-login.php">Sign in</a>';

                const backbarRight = noteHref
                  ? `<a class="right" href="${escapeHTML(noteHref)}">${note}</a>`
                  : `<span class="right">${note}</span>`;

                const root = this.attachShadow({ mode: 'open' });
                root.innerHTML = `
                  <style>
                    :host {
                      all: initial;
                      --paper: #f4ede0;
                      --paper-light: #faf5e9;
                      --ink: #1a1611;
                      --ink-soft: #4a4036;
                      --ink-faint: #8a7f70;
                      --seal: #a02d23;
                      --rule: rgba(26,22,17,.28);
                      --serif-cn: "Noto Serif SC","EB Garamond",serif;
                      --mono: "JetBrains Mono",ui-monospace,monospace;
                      display: block;
                      width: 100%;
                      min-width: 0;
                      margin: 0;
                      padding: 0;
                      border: 0;
                      color: var(--ink);
                      font-family: var(--mono);
                      font-size: 10px;
                      font-style: normal;
                      font-weight: 400;
                      line-height: 16px;
                      letter-spacing: .18em;
                      text-transform: uppercase;
                      font-feature-settings: normal;
                      font-kerning: normal;
                      font-variant: normal;
                      font-synthesis: none;
                      text-rendering: geometricPrecision;
                      -webkit-font-smoothing: antialiased;
                      -webkit-text-size-adjust: 100%;
                      text-size-adjust: 100%;
                    }

                    *, *::before, *::after { box-sizing: border-box; }
                    a { color: inherit; text-decoration: none; }

                    .shell { width: 100%; min-width: 0; }

                    .backbar {
                      width: 100%;
                      height: 32px;
                      padding: 0 28px;
                      background: var(--ink);
                      color: var(--paper-light);
                      display: grid;
                      grid-template-columns: minmax(0,1fr) auto minmax(0,1fr);
                      align-items: center;
                      gap: 14px;
                      font-family: var(--mono);
                      font-size: 10px;
                      font-weight: 400;
                      line-height: 16px;
                      letter-spacing: .1em;
                      text-transform: uppercase;
                    }
                    .backbar .back,
                    .backbar .context,
                    .backbar .right {
                      min-width: 0;
                      height: 16px;
                      line-height: 16px;
                      white-space: nowrap;
                      overflow: hidden;
                      text-overflow: ellipsis;
                    }
                    .backbar .back { justify-self: start; color: var(--seal); border-bottom: 1px dashed var(--seal); }
                    .backbar .context { justify-self: center; text-align: center; }
                    .backbar .right { justify-self: end; text-align: right; color: var(--ink-faint); }
                    .backbar a.right { color: var(--seal); border-bottom: 1px dashed var(--seal); }

                    .nav-strip { width: 100%; padding: 20px 56px 0; }
                    .site-nav {
                      width: 100%;
                      display: grid;
                      grid-template-columns: 1fr auto 1fr;
                      align-items: center;
                      gap: 0;
                      padding: 0 0 18px;
                      border-bottom: 1px solid var(--rule);
                      font-family: var(--mono);
                      font-size: 10px;
                      font-style: normal;
                      font-weight: 400;
                      line-height: 24px;
                      letter-spacing: .18em;
                      text-transform: uppercase;
                      color: var(--ink-soft);
                    }
                    .left, .right-nav {
                      min-width: 0;
                      min-height: 24px;
                      display: flex;
                      align-items: center;
                      gap: 28px;
                    }
                    .left { flex-wrap: wrap; justify-content: flex-start; }
                    .right-nav { justify-content: flex-end; }
                    .center {
                      height: 24px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-family: var(--serif-cn);
                      font-size: 13px;
                      font-style: normal;
                      font-weight: 500;
                      line-height: 24px;
                      letter-spacing: .5em;
                      color: var(--ink);
                      white-space: nowrap;
                    }
                    .nav-link {
                      display: inline-flex;
                      align-items: center;
                      height: 24px;
                      padding: 0;
                      border: 0;
                      font-family: var(--mono);
                      font-size: 10px;
                      font-style: normal;
                      font-weight: 400;
                      line-height: 24px;
                      letter-spacing: .18em;
                      text-transform: uppercase;
                      color: var(--ink-soft);
                      white-space: nowrap;
                      transition: color .2s;
                    }
                    .nav-link:hover { color: var(--seal); }
                    .nav-link.active {
                      color: var(--seal);
                      box-shadow: inset 0 -1px 0 var(--seal);
                    }

                    @media (max-width: 900px) {
                      .backbar {
                        height: 56px;
                        padding: 6px 14px;
                        grid-template-columns: minmax(0,1fr) minmax(0,1fr);
                        grid-template-rows: 18px 18px;
                        grid-template-areas: "back right" "context context";
                        gap: 2px 12px;
                      }
                      .backbar .back { grid-area: back; }
                      .backbar .context { grid-area: context; width: 100%; justify-self: stretch; }
                      .backbar .right { grid-area: right; }
                      .nav-strip { padding: 14px 22px 0; }
                      .site-nav { grid-template-columns: 1fr; gap: 14px; text-align: center; }
                      .left, .right-nav { justify-content: center; }
                    }
                  </style>
                  <div class="shell">
                    <div class="backbar">
                      <a class="back" href="./ink-east-v1.html">← Back to Ink &amp; East</a>
                      <span class="context">${context}</span>
                      ${backbarRight}
                    </div>
                    <div class="nav-strip">
                      <nav class="site-nav" aria-label="Ink & East section navigation">
                        <div class="left">${left}</div>
                        <div class="center">墨 與 東</div>
                        <div class="right-nav">${account}</div>
                      </nav>
                    </div>
                  </div>
                `;
              }
            }

            if (!customElements.get('ink-east-service-nav')) {
              customElements.define('ink-east-service-nav', InkEastServiceNav);
            }
          })();
          '''

          shared = Path('preview/shared/ink-east-service-nav.js')
          shared.parent.mkdir(parents=True, exist_ok=True)
          shared.write_text(component, encoding='utf-8')

          shell_pattern = re.compile(
              r'<div class="backbar">.*?</div>\s*(?:<!--.*?-->\s*)*<div class="nav-strip">\s*<nav class="site-nav">.*?</nav>\s*</div>',
              re.S,
          )

          simple_rule = re.compile(r'([^{}]+)\{([^{}]*)\}')
          def strip_legacy_nav_css(text):
              def replace_rule(match):
                  selector = match.group(1).strip()
                  if any(token in selector for token in ('.backbar', '.nav-strip', '.site-nav')):
                      return ''
                  return match.group(0)
              previous = None
              while previous != text:
                  previous = text
                  text = simple_rule.sub(replace_rule, text)
              text = re.sub(r'@media[^{}]+\{\s*\}', '', text)
              return text

          for path_str, cfg in configs.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              matches = shell_pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'{path_str}: expected exactly one legacy backbar+nav shell, found {len(matches)}')

              attrs = [
                  f'active="{html.escape(cfg["active"], quote=True)}"',
                  f'auth="{html.escape(cfg["auth"], quote=True)}"',
                  f'context="{html.escape(cfg["context"], quote=True)}"',
                  f'note="{html.escape(cfg["note"], quote=True)}"',
              ]
              if cfg.get('note_href'):
                  attrs.append(f'note-href="{html.escape(cfg["note_href"], quote=True)}"')

              mount = '<ink-east-service-nav ' + ' '.join(attrs) + '></ink-east-service-nav>\n<script src="./shared/ink-east-service-nav.js"></script>'
              text = shell_pattern.sub(mount, text, count=1)
              text = strip_legacy_nav_css(text)

              if '<div class="backbar">' in text or '<div class="nav-strip">' in text or '<nav class="site-nav">' in text:
                  raise SystemExit(f'{path_str}: legacy shell markup still present')
              if text.count('<ink-east-service-nav ') != 1 or text.count('./shared/ink-east-service-nav.js') != 1:
                  raise SystemExit(f'{path_str}: shared mount/loader count invalid')

              styles = '\n'.join(re.findall(r'<style[^>]*>(.*?)</style>', text, re.S))
              styles = re.sub(r'/\*.*?\*/', '', styles, flags=re.S)
              if re.search(r'\.(?:backbar|nav-strip|site-nav)\b', styles):
                  raise SystemExit(f'{path_str}: legacy shell CSS still present')
              if text.count('<ink-east-footer></ink-east-footer>') != 1:
                  raise SystemExit(f'{path_str}: shared footer mount was disturbed')

              path.write_text(text, encoding='utf-8')
              print('Migrated', path_str, cfg)

          print('PASS: migrated 8/8 service-family pages to one shared navigation source.')
          PY

      - name: Install browser harness
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify shared navigation geometry and semantics
        shell: bash
        run: |
          python3 -m http.server 4173 --directory preview >/tmp/nav-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');

          const targets = [
            ['ink-east-membership-v1.html', 'membership', 'guest'],
            ['ink-east-vip-library-v1.html', 'vip-library', 'guest'],
            ['ink-east-reading-room-v1.html', 'reading-room', 'member'],
            ['ink-east-letters-form-v1.html', 'ask-ancient', 'guest'],
            ['ink-east-custom-ebook-v1.html', 'studio', 'guest'],
            ['ink-east-community-v1.html', 'community', 'guest'],
            ['ink-east-custom-reading-v1.html', 'studio', 'guest'],
            ['ink-east-reader-notes-component-v1.html', '', 'guest'],
          ];
          const viewports = [
            { name: 'desktop', width: 1365, height: 991 },
            { name: 'tablet', width: 820, height: 1024 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const tolerance = 0.1;
          const round = n => Math.round(n * 1000) / 1000;

          function compare(a, b, path = '', diffs = []) {
            if (typeof a === 'number' && typeof b === 'number') {
              if (Math.abs(a - b) > tolerance) diffs.push(`${path}: ${a} != ${b}`);
              return diffs;
            }
            if (Array.isArray(a) && Array.isArray(b)) {
              if (a.length !== b.length) return diffs.concat(`${path}.length: ${a.length} != ${b.length}`);
              a.forEach((v, i) => compare(v, b[i], `${path}[${i}]`, diffs));
              return diffs;
            }
            if (a && b && typeof a === 'object' && typeof b === 'object') {
              for (const key of Object.keys(a)) compare(a[key], b[key], path ? `${path}.${key}` : key, diffs);
              return diffs;
            }
            if (a !== b) diffs.push(`${path}: ${String(a)} != ${String(b)}`);
            return diffs;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failed = false;

            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
              const samples = [];

              for (const [file, expectedActive, auth] of targets) {
                const page = await context.newPage();
                await page.goto(`http://127.0.0.1:4173/${file}`, { waitUntil: 'networkidle' });
                await page.evaluate(async () => {
                  if (document.fonts) {
                    await Promise.all([
                      document.fonts.load('10px "JetBrains Mono"', 'Reading Room'),
                      document.fonts.load('13px "Noto Serif SC"', '墨與東'),
                      document.fonts.ready,
                    ]);
                  }
                });
                await page.waitForFunction(() => {
                  const host = document.querySelector('ink-east-service-nav');
                  return Boolean(host?.shadowRoot?.querySelector('.site-nav'));
                });
                await page.evaluate(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));

                const metrics = await page.evaluate(() => {
                  const host = document.querySelector('ink-east-service-nav');
                  const root = host.shadowRoot;
                  const hostRect = host.getBoundingClientRect();
                  const rel = element => {
                    const r = element.getBoundingClientRect();
                    return { top: roundLocal(r.top - hostRect.top), left: roundLocal(r.left - hostRect.left), width: roundLocal(r.width), height: roundLocal(r.height) };
                  };
                  function roundLocal(n) { return Math.round(n * 1000) / 1000; }
                  const leftLinks = [...root.querySelectorAll('.left .nav-link')];
                  return {
                    fonts: {
                      mono: document.fonts.check('10px "JetBrains Mono"', 'Reading Room'),
                      noto: document.fonts.check('13px "Noto Serif SC"', '墨與東'),
                    },
                    geometry: {
                      host: { width: roundLocal(hostRect.width), height: roundLocal(hostRect.height) },
                      backbar: rel(root.querySelector('.backbar')),
                      back: rel(root.querySelector('.back')),
                      context: { top: rel(root.querySelector('.context')).top, height: rel(root.querySelector('.context')).height },
                      backRight: { top: rel(root.querySelector('.backbar .right')).top, height: rel(root.querySelector('.backbar .right')).height },
                      navStrip: rel(root.querySelector('.nav-strip')),
                      siteNav: rel(root.querySelector('.site-nav')),
                      left: rel(root.querySelector('.left')),
                      center: rel(root.querySelector('.center')),
                      right: rel(root.querySelector('.right-nav')),
                      leftLinks: leftLinks.map(rel),
                    },
                    labels: leftLinks.map(a => a.textContent.trim()),
                    hrefs: leftLinks.map(a => a.getAttribute('href')),
                    active: leftLinks.filter(a => a.classList.contains('active')).map(a => a.textContent.trim()),
                    rightLabels: [...root.querySelectorAll('.right-nav .nav-link')].map(a => a.textContent.trim()),
                  };
                });

                const expectedLabel = {
                  'membership': 'Membership', 'vip-library': 'VIP Library', 'reading-room': 'Reading Room',
                  'ask-ancient': 'Ask the Ancient', 'studio': 'Studio', 'community': 'Community', '': null,
                }[expectedActive];
                const expectedActiveLabels = expectedLabel ? [expectedLabel] : [];
                const expectedRight = auth === 'member' ? ['Account', 'Sign out'] : ['Sign in'];
                if (JSON.stringify(metrics.active) !== JSON.stringify(expectedActiveLabels)) {
                  failed = true;
                  console.error(`[${viewport.name}] ${file}: active mismatch ${JSON.stringify(metrics.active)} expected ${JSON.stringify(expectedActiveLabels)}`);
                }
                if (JSON.stringify(metrics.rightLabels) !== JSON.stringify(expectedRight)) {
                  failed = true;
                  console.error(`[${viewport.name}] ${file}: auth links mismatch ${JSON.stringify(metrics.rightLabels)} expected ${JSON.stringify(expectedRight)}`);
                }
                samples.push({ file, metrics });
                await page.close();
              }

              const baseline = samples[0];
              for (const sample of samples.slice(1)) {
                const diffs = [
                  ...compare(baseline.metrics.fonts, sample.metrics.fonts),
                  ...compare(baseline.metrics.geometry, sample.metrics.geometry),
                  ...compare(baseline.metrics.labels, sample.metrics.labels),
                  ...compare(baseline.metrics.hrefs, sample.metrics.hrefs),
                ];
                if (diffs.length) {
                  failed = true;
                  console.error(`[${viewport.name}] FAIL ${sample.file}: ${diffs.slice(0, 30).join('; ')}`);
                } else {
                  console.log(`[${viewport.name}] PASS ${sample.file}`);
                }
              }
              console.log(`[${viewport.name}] baseline host ${baseline.metrics.geometry.host.width}×${baseline.metrics.geometry.host.height}`);
              await context.close();
            }

            await browser.close();
            if (failed) process.exit(1);
            console.log('PASS: 8/8 pages share identical service-nav geometry and canonical nav links at desktop/tablet/mobile; page-specific active/auth semantics are preserved.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit verified migration and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-audit-service-nav.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/ink-east-membership-v1.html \
                  preview/ink-east-vip-library-v1.html \
                  preview/ink-east-reading-room-v1.html \
                  preview/ink-east-letters-form-v1.html \
                  preview/ink-east-custom-ebook-v1.html \
                  preview/ink-east-community-v1.html \
                  preview/ink-east-custom-reading-v1.html \
                  preview/ink-east-reader-notes-component-v1.html \
                  preview/shared/ink-east-service-nav.js \
                  .github/workflows/tmp-audit-service-nav.yml
          git diff --cached --check
          changed=$(git diff --cached --name-only | sort)
          printf '%s\n' "$changed"
          expected=$(printf '%s\n' \
            .github/workflows/tmp-audit-service-nav.yml \
            preview/ink-east-community-v1.html \
            preview/ink-east-custom-ebook-v1.html \
            preview/ink-east-custom-reading-v1.html \
            preview/ink-east-letters-form-v1.html \
            preview/ink-east-membership-v1.html \
            preview/ink-east-reader-notes-component-v1.html \
            preview/ink-east-reading-room-v1.html \
            preview/ink-east-vip-library-v1.html \
            preview/shared/ink-east-service-nav.js | sort)
          test "$changed" = "$expected"
          git commit -m "preview(ink-east): share service navigation shell"
          git push origin HEAD:agent/ink-east-service-nav-normalization
