name: Temporary shared Ink East footer migration

on:
  push:
    branches:
      - agent/ink-east-shared-footer

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/ink-east-shared-footer
          fetch-depth: 0

      - name: Replace page-local footer markup with shared component mount
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          targets = [
              'preview/ink-east-v1.html',
              'preview/ink-east-issue-001-v1.html',
              'preview/ink-east-article-001-v1.html',
              'preview/ink-east-article-002-vip-v1.html',
              'preview/ink-east-articles-archive-v1.html',
              'preview/ink-east-vip-library-v1.html',
              'preview/ink-east-reading-room-v1.html',
              'preview/ink-east-membership-v1.html',
              'preview/ink-east-custom-reading-v1.html',
              'preview/ink-east-custom-ebook-v1.html',
              'preview/ink-east-letters-form-v1.html',
              'preview/ink-east-reader-notes-component-v1.html',
              'preview/ink-east-community-v1.html',
          ]

          footer_pattern = re.compile(r'<footer(?:\s[^>]*)?>.*?</footer>', re.S)
          mount = '<ink-east-footer></ink-east-footer>\n<script src="./shared/ink-east-footer.js"></script>'

          for name in targets:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              matches = list(footer_pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected exactly one footer, found {len(matches)}')
              updated = footer_pattern.sub(mount, text, count=1)
              if updated.count('<ink-east-footer></ink-east-footer>') != 1:
                  raise SystemExit(f'{name}: shared footer mount verification failed')
              if updated.count('./shared/ink-east-footer.js') != 1:
                  raise SystemExit(f'{name}: shared footer loader verification failed')
              if footer_pattern.search(updated):
                  raise SystemExit(f'{name}: page-local footer markup still present')
              path.write_text(updated, encoding='utf-8')

          allowed = set(targets + ['.github/workflows/tmp-shared-ink-east-footer.yml'])
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          unexpected = [name for name in changed if name not in allowed]
          if unexpected:
              raise SystemExit('Unexpected changed files: ' + ', '.join(unexpected))

          print(f'Migrated {len(targets)} active Ink & East preview pages to one shared footer component.')
          PY

      - name: Remove temporary workflow and commit migration
        shell: bash
        run: |
          rm .github/workflows/tmp-shared-ink-east-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/ink-east-*.html preview/shared/ink-east-footer.js .github/workflows/tmp-shared-ink-east-footer.yml
          git diff --cached --check
          git commit -m "preview(ink-east): use one shared footer component"
          git push origin HEAD:agent/ink-east-shared-footer
