name: Commerce Batch A Verify

on:
  workflow_dispatch:
  push:
    branches:
      - feature/commerce-batch-a
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate Payload types
        run: pnpm generate:types
        env:
          DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/verify
          PAYLOAD_SECRET: commerce-batch-a-verifier-secret
      - name: Typecheck
        run: pnpm typecheck
      - name: Commerce contracts
        run: pnpm check:commerce-contract
      - name: Build
        run: pnpm build
        env:
          DATABASE_URI: postgresql://postgres:postgres@127.0.0.1:5432/verify
          PAYLOAD_SECRET: commerce-batch-a-verifier-secret
