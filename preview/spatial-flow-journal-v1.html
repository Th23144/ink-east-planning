<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=./ink-east-v1.html">
<title>Redirecting to Ink &amp; East</title>
<style>
  :root {
    --paper: #f4ede0;
    --paper-light: #faf5e9;
    --ink: #1a1611;
    --ink-soft: #4a4036;
    --seal: #a02d23;
    --rule: rgba(26,22,17,.24);
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    display: grid;
    place-items: center;
    padding: 28px;
    text-align: center;
  }
  .card {
    max-width: 720px;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--rule);
    padding: 56px 0;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--seal);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(38px, 6vw, 74px);
    line-height: 1.02;
    font-weight: 400;
    margin: 0 0 18px;
  }
  h1 em { color: var(--seal); font-style: italic; }
  p {
    font-size: 18px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0 auto 28px;
    max-width: 560px;
  }
  a {
    display: inline-flex;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 3px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  a:hover { color: var(--seal); border-color: var(--seal); }
</style>
<script>
  window.location.replace('./ink-east-v1.html');
</script>
</head>
<body>
  <main class="card">
    <div class="kicker">Legacy Spatial Flow Journal</div>
    <h1>Redirecting to <em>Ink &amp; East</em>.</h1>
    <p>The old Spatial Flow Journal preview has been retired as an active destination. The Journal now belongs to Ink &amp; East.</p>
    <a href="./ink-east-v1.html">Open Ink &amp; East →</a>
  </main>
</body>
</html>
